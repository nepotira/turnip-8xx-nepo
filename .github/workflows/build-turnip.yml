name: Build Turnip Adreno 8xx & 8s Gen 4 Drivers

on:
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: "Mesa Git ref (branch or commit SHA)"
        required: false
        default: "main"
      publish_release:
        description: "Create a GitHub Release with compiled AdrenoTools .zip drivers"
        type: boolean
        required: false
        default: false
      skip_patches:
        description: "Patches a NAO aplicar (nomes exatos separados por virgula)"
        required: false
        default: ""
      strict:
        description: "Falhar o build se algum patch falhar"
        type: boolean
        required: false
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-stack:
    name: Verify 4-Layer Patch Stack & GMEM Math
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run deterministic patch & GMEM verifier
        run: python3 scripts/verify_patch_stack.py

  build-variants:
    name: Build Turnip (${{ matrix.package_name }})
    needs: verify-stack
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: sustained
            suffix: "-b"
            package_name: "Turnip-A8xx-8sGen4-Sustained"
            description: "Balanced & Sustained for Snapdragon 8s Gen 4 (Adreno 825) & Adreno 8xx (528 KB GMEM, UBWC, SP Hysteresis)"
          - variant: biggmem
            suffix: "-e"
            package_name: "Turnip-A8xx-8sGen4-BigGMEM"
            description: "Extended 656 KB GMEM for Switch Emulation (Eden/Citron/Sudachi) on Adreno 825 & Adreno 8xx"
          - variant: maxperf
            suffix: "-p"
            package_name: "Turnip-A8xx-8sGen4-MaxPerf"
            description: "Max Peak Throughput for Winlator/GameHub DX12/VK on Adreno 825 & Adreno 8xx (Active Cooling Recommended)"
          - variant: switch2
            suffix: "-s2"
            package_name: "Turnip-A8xx-8sGen4-Switch2"
            description: "Specialized for Nintendo Switch 2 (T239/NVN2), DLSS 5 / Cooperative Matrix, Mesh Shaders & Zero-Stutter Shader Delivery"

    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4
        with:
          path: patch-repo

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential python3-pip flex bison glslang-tools \
            ninja-build ccache zip unzip pkg-config curl git patchelf
          sudo python3 -m pip install --quiet --break-system-packages meson mako packaging pyyaml
          meson --version

      - name: Cache Android NDK r29
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /home/runner/android-ndk-r29
          key: ndk-android-ndk-r29

      - name: Download & extract Android NDK r29
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          NDK_ZIP="android-ndk-r29-linux.zip"
          for attempt in 1 2 3; do
            curl -fsSL "https://dl.google.com/android/repository/${NDK_ZIP}" -o "${NDK_ZIP}" && break || sleep 5
          done
          unzip -q "${NDK_ZIP}" -d "/home/runner"
          rm -f "${NDK_ZIP}"

      - name: Clone Mesa 26.2-devel (with retry)
        run: |
          MESA_REF="${{ github.event.inputs.mesa_ref || 'main' }}"
          for attempt in 1 2 3 4; do
            rm -rf mesa-src
            if git clone --depth=500 https://gitlab.freedesktop.org/mesa/mesa.git mesa-src; then
              break
            fi
            echo "Clone attempt ${attempt} failed, retrying in 10s..."
            sleep 10
          done
          cd mesa-src
          git checkout "$MESA_REF"
          echo "MESA_SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Apply 4-Layer Turnip A8xx Patch Stack (${{ matrix.variant }})
        run: |
          python3 patch-repo/scripts/apply_all_patches.py \
            --mesa-dir mesa-src \
            --variant "${{ matrix.variant }}" \
            --skip "${{ github.event.inputs.skip_patches }}" \
            ${{ github.event.inputs.strict == 'true' && '--strict' || '' }}

      - name: Apply NDK r29 compatibility fixes, generate Meson cross-file & compile Turnip
        run: |
          # NDK r29 strict C/C++ pointer and empty-initializer fixes on Android stub
          sed -i 's/typedef const native_handle_t\* buffer_handle_t;/typedef void* buffer_handle_t;/g' mesa-src/include/android_stub/cutils/native_handle.h 2>/dev/null || true
          sed -i 's/, hnd->handle/, (void *)hnd->handle/g' mesa-src/src/util/u_gralloc/u_gralloc_fallback.c 2>/dev/null || true
          sed -i -E 's/([a-z_]+)->handle->/((const native_handle_t *)\1->handle)->/g' mesa-src/src/vulkan/runtime/vk_android.c 2>/dev/null || true
          sed -i 's/anb->handle->/((const native_handle_t *)anb->handle)->/g' mesa-src/src/vulkan/runtime/vk_android.c 2>/dev/null || true
          sed -i "/-Werror=gnu-empty-initializer/d" mesa-src/meson.build 2>/dev/null || true

          TOOLCHAIN="/home/runner/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin"
          API_LEVEL="34"
          mkdir -p "$HOME/ndk-bin"
          ln -sf "${TOOLCHAIN}/clang" "$HOME/ndk-bin/cc"
          ln -sf "${TOOLCHAIN}/clang++" "$HOME/ndk-bin/c++"
          export PATH="$HOME/ndk-bin:${TOOLCHAIN}:$PATH"
          export CC=clang
          export CXX=clang++
          export AR=llvm-ar
          export RANLIB=llvm-ranlib
          export STRIP=llvm-strip
          export LDFLAGS="-fuse-ld=lld"
          export CFLAGS="-D__ANDROID__ -Wno-error -Wno-error=gnu-empty-initializer -Wno-gnu-empty-initializer -Wno-deprecated-declarations -Wno-incompatible-pointer-types-discards-qualifiers -Wno-incompatible-pointer-types"
          export CXXFLAGS="-D__ANDROID__ -Wno-error -Wno-error=gnu-empty-initializer -Wno-gnu-empty-initializer -Wno-deprecated-declarations -Wno-incompatible-pointer-types-discards-qualifiers -Wno-incompatible-pointer-types"

          cat <<EOF > android-aarch64.txt
          [binaries]
          ar = '${TOOLCHAIN}/llvm-ar'
          c = ['ccache', '${TOOLCHAIN}/aarch64-linux-android${API_LEVEL}-clang']
          cpp = ['ccache', '${TOOLCHAIN}/aarch64-linux-android${API_LEVEL}-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '--start-no-unused-arguments', '-static-libstdc++', '--end-no-unused-arguments']
          c_ld = '${TOOLCHAIN}/ld.lld'
          cpp_ld = '${TOOLCHAIN}/ld.lld'
          strip = '${TOOLCHAIN}/llvm-strip'
          pkg-config = ['env', 'PKG_CONFIG_LIBDIR=${TOOLCHAIN}/pkg-config', '/usr/bin/pkg-config']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF

          cat <<EOF > native.txt
          [build_machine]
          c = ['ccache', 'clang']
          cpp = ['ccache', 'clang++']
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          c_ld = 'ld.lld'
          cpp_ld = 'ld.lld'
          system = 'linux'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'
          EOF

          meson setup mesa-build mesa-src \
            --cross-file android-aarch64.txt \
            --native-file native.txt \
            --prefix "$PWD/mesa-install" \
            -Dbuildtype=release \
            -Db_lto=false \
            -Dstrip=true \
            -Dplatforms=android \
            -Dvideo-codecs= \
            -Dplatform-sdk-version=${API_LEVEL} \
            -Dandroid-stub=true \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dvulkan-beta=true \
            -Dfreedreno-kmds=kgsl \
            -Degl=disabled \
            -Dandroid-libbacktrace=disabled

          ninja -C mesa-build install

      - name: Package AdrenoTools .zip (${{ matrix.package_name }})
        run: |
          VERSION=$(cat patch-repo/VERSION | tr -d '[:space:]')
          PKG_DIR="pkg-${{ matrix.variant }}"
          mkdir -p "${PKG_DIR}"
          cp mesa-install/lib/libvulkan_freedreno.so "${PKG_DIR}/vulkan.nepo.so"
          patchelf --set-soname vulkan.nepo.so "${PKG_DIR}/vulkan.nepo.so"
          cp patch-repo/LICENSE patch-repo/NOTICE patch-repo/THIRD_PARTY_LICENSES.md "${PKG_DIR}/"

          cat <<EOF > "${PKG_DIR}/meta.json"
          {
            "schemaVersion": 1,
            "name": "${{ matrix.package_name }} v${VERSION} (${MESA_SHORT_SHA})",
            "description": "${{ matrix.description }}",
            "author": "Nepo / Turnip A8xx Hybrid Stack",
            "packageVersion": "${VERSION}${{ matrix.suffix }}",
            "vendor": "Mesa / Freedreno Turnip",
            "driverVersion": "Mesa 26.2.0-devel (${MESA_SHORT_SHA})",
            "minApi": 30,
            "libraryName": "vulkan.nepo.so"
          }
          EOF

          ZIP_NAME="${{ matrix.package_name }}-v${VERSION}-${MESA_SHORT_SHA}.zip"
          (cd "${PKG_DIR}" && zip -9 "../${ZIP_NAME}" vulkan.nepo.so meta.json LICENSE NOTICE THIRD_PARTY_LICENSES.md)
          ls -lh "${ZIP_NAME}"

      - name: Upload AdrenoTools .zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_name }}
          path: "${{ matrix.package_name }}-*.zip"
          retention-days: 30
